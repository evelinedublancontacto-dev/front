<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-medita" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <!-- Celestial halo ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-medita)" stroke-width="1.25" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Sacred Crescent Moon in the background -->
  <path d="M37 10 C46 14 49 26 44 36 C40 44 30 48 20 46 C27 49 37 47 43 41 C48 34 47 21 38 13 C35 11 31 10 27 10 C30 9.5 34 9.5 37 10 Z" stroke="url(#gold-medita)" stroke-width="1.25" stroke-linejoin="round" opacity="0.75" />

  <!-- Meditating Silhouette (Lotus Pose) -->
  <!-- Head & Halo -->
  <circle cx="32" cy="20" r="4.5" stroke="url(#gold-medita)" stroke-width="1.75" />
  
  <!-- Torso & Heart Center -->
  <path d="M32 25 L32 37" stroke="url(#gold-medita)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M32 29 L33.5 31 L36 31.5 L33.5 33 L32 35 L30.5 33 L28 31.5 L30.5 31 Z" stroke="url(#gold-medita)" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Arms / Anjali Mudra / Dhyana -->
  <path d="M26 27 C24 30 22 36 26 39 C28 40 31 38 32 36" stroke="url(#gold-medita)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M38 27 C40 30 42 36 38 39 C36 40 33 38 32 36" stroke="url(#gold-medita)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Crossed Legs (Padmasana) -->
  <path d="M16 45 C19 41 26 40 32 40 C38 40 45 41 48 45 C47 48 41 50 32 50 C23 50 17 48 16 45 Z" stroke="url(#gold-medita)" stroke-width="1.75" stroke-linejoin="round" />

  <!-- Sacred Lotus Base -->
  <path d="M32 50 C29 53 23 54 20 53 C22 56 30 57 32 57 C34 57 42 56 44 53 C41 54 35 53 32 50 Z" stroke="url(#gold-medita)" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radiating starlight above head -->
  <path d="M32 8 L32 12 M30 10 L34 10" stroke="url(#gold-medita)" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="16" cy="24" r="1" fill="#D4AF37" />
  <circle cx="48" cy="26" r="1" fill="#D4AF37" />
</svg>
