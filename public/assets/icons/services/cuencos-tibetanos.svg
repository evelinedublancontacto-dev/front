<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-cuencos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <!-- Celestial halo ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-cuencos)" stroke-width="1.25" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Harmonic Vibration Waves rising from the bowl -->
  <path d="M22 24 C22 17 42 17 42 24" stroke="url(#gold-cuencos)" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M17 19 C17 9 47 9 47 19" stroke="url(#gold-cuencos)" stroke-width="1.25" stroke-linecap="round" opacity="0.5" />
  <path d="M12 14 C12 3 52 3 52 14" stroke="url(#gold-cuencos)" stroke-width="1" stroke-linecap="round" stroke-dasharray="2 2" opacity="0.35" />

  <!-- Harmonic Star in the center of the vibration -->
  <path d="M32 10 L33.5 13.5 L37 15 L33.5 16.5 L32 20 L30.5 16.5 L27 15 L30.5 13.5 Z" stroke="url(#gold-cuencos)" stroke-width="1.25" stroke-linejoin="round" />

  <!-- Tibetan Singing Bowl (Cuenco) Rim and Body -->
  <!-- Bowl Rim -->
  <ellipse cx="32" cy="33" rx="20" ry="5.5" stroke="url(#gold-cuencos)" stroke-width="1.75" />
  <!-- Bowl Body -->
  <path d="M12 33 C12 48 20 54 32 54 C44 54 52 48 52 33" stroke="url(#gold-cuencos)" stroke-width="2" stroke-linecap="round" />
  <!-- Bowl Base -->
  <path d="M25 54 C25 56.5 39 56.5 39 54" stroke="url(#gold-cuencos)" stroke-width="1.75" />
  <!-- Sacred line on bowl body -->
  <path d="M17 38 C20 45 44 45 47 38" stroke="url(#gold-cuencos)" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

  <!-- Mallet (Mazo de madera) resting diagonally -->
  <path d="M43 23 L51 15 C52.5 13.5 54.5 15.5 53 17 L45 25" stroke="url(#gold-cuencos)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Subtle vibration droplets / sparkles -->
  <circle cx="20" cy="13" r="1.2" fill="#D4AF37" />
  <circle cx="44" cy="13" r="1.2" fill="#D4AF37" />
  <circle cx="28" cy="27" r="1" fill="#D4AF37" />
  <circle cx="36" cy="27" r="1" fill="#D4AF37" />
</svg>
