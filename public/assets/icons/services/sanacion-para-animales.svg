<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-animales" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <!-- Celestial halo ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-animales)" stroke-width="1.25" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Sacred Crescent Moon framing the top right -->
  <path d="M43 12 C49 16 52 24 49 32 C46 38 39 42 33 42 C38 43 45 40 48 34 C51 28 49 19 42 13 C40 12 37 11 35 11 C38 11 41 11.5 43 12 Z" stroke="url(#gold-animales)" stroke-width="1.25" stroke-linejoin="round" opacity="0.75" />

  <!-- Sacred Paw Print: 4 Toes / Pads in delicate gold outline -->
  <!-- Toe 1 (Far Left) -->
  <ellipse cx="20" cy="24" rx="4" ry="5.5" transform="rotate(-25 20 24)" stroke="url(#gold-animales)" stroke-width="1.75" />
  <!-- Toe 2 (Center Left) -->
  <ellipse cx="27.5" cy="18" rx="4.2" ry="6" transform="rotate(-8 27.5 18)" stroke="url(#gold-animales)" stroke-width="1.75" />
  <!-- Toe 3 (Center Right) -->
  <ellipse cx="36.5" cy="18" rx="4.2" ry="6" transform="rotate(8 36.5 18)" stroke="url(#gold-animales)" stroke-width="1.75" />
  <!-- Toe 4 (Far Right) -->
  <ellipse cx="44" cy="24" rx="4" ry="5.5" transform="rotate(25 44 24)" stroke="url(#gold-animales)" stroke-width="1.75" />

  <!-- Main Metacarpal Pad (Sacred Heart / Organic Shape) -->
  <path d="M32 32 C26 32 19 34 18 40 C17 46 22 51 32 51 C42 51 47 46 46 40 C45 34 38 32 32 32 Z" stroke="url(#gold-animales)" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Sacred Heart / Light inside the central pad -->
  <path d="M32 38 C30 35 26 36 26 39 C26 42 32 46 32 46 C32 46 38 42 38 39 C38 36 34 35 32 38 Z" stroke="url(#gold-animales)" stroke-width="1.25" stroke-linejoin="round" opacity="0.85" />

  <!-- Healing Angelic Wing / Protective Aura around Paw -->
  <path d="M11 44 C8 38 9 29 14 24" stroke="url(#gold-animales)" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />
  <path d="M53 44 C56 38 55 29 50 24" stroke="url(#gold-animales)" stroke-width="1.25" stroke-linecap="round" opacity="0.6" />

  <!-- Celestial Blessing Stars -->
  <path d="M32 7 L33 9 L35 10 L33 11 L32 13 L31 11 L29 10 L31 9 Z" stroke="url(#gold-animales)" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="15" cy="15" r="1.2" fill="#D4AF37" />
  <circle cx="49" cy="15" r="1.2" fill="#D4AF37" />
  <circle cx="32" cy="56" r="1.2" fill="#D4AF37" />
</svg>
