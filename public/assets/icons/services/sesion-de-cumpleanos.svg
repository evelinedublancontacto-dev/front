<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-cumple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <!-- Outer Solar Cycle / Halo -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-cumple)" stroke-width="1.25" stroke-dasharray="2 3" opacity="0.6" />

  <!-- 12 Mystical Sun Rays (Retorno Solar / Portal de Nacimiento) -->
  <path d="M32 6 L32 12" stroke="url(#gold-cumple)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M32 52 L32 58" stroke="url(#gold-cumple)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M6 32 L12 32" stroke="url(#gold-cumple)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M52 32 L58 32" stroke="url(#gold-cumple)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M14 14 L18 18" stroke="url(#gold-cumple)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M46 46 L50 50" stroke="url(#gold-cumple)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M50 14 L46 18" stroke="url(#gold-cumple)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M18 46 L14 50" stroke="url(#gold-cumple)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Solar Ring of Life -->
  <circle cx="32" cy="32" r="17" stroke="url(#gold-cumple)" stroke-width="1.5" />
  <circle cx="32" cy="32" r="14" stroke="url(#gold-cumple)" stroke-width="1" stroke-dasharray="3 2" opacity="0.7" />

  <!-- Sacred Gift Portal / Star in the center -->
  <!-- Gift Ribbon Bow (Mystical infinity / butterfly loop) -->
  <path d="M32 23 C29 19 25 21 27 24 C29 26 32 25 32 25 C32 25 35 26 37 24 C39 21 35 19 32 23 Z" stroke="url(#gold-cumple)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Sacred Box / Portal cube -->
  <rect x="23" y="25" width="18" height="15" rx="2" stroke="url(#gold-cumple)" stroke-width="1.75" />
  <!-- Vertical and Horizontal Ribbon Lines -->
  <path d="M32 25 L32 40" stroke="url(#gold-cumple)" stroke-width="1.5" />
  <path d="M23 32.5 L41 32.5" stroke="url(#gold-cumple)" stroke-width="1.5" />

  <!-- Central Radiating Starburst -->
  <path d="M32 29 L33 31.5 L35.5 32.5 L33 33.5 L32 36 L31 33.5 L28.5 32.5 L31 31.5 Z" stroke="url(#gold-cumple)" stroke-width="1.25" stroke-linejoin="round" />

  <!-- Floating Birthday Portal Sparkles -->
  <circle cx="21" cy="18" r="1.2" fill="#D4AF37" />
  <circle cx="43" cy="18" r="1.2" fill="#D4AF37" />
  <circle cx="21" cy="46" r="1.2" fill="#D4AF37" />
  <circle cx="43" cy="46" r="1.2" fill="#D4AF37" />
</svg>
