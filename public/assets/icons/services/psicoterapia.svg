<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-psico-bloom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Delicate Outer Sacred Circle -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-psico-bloom)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.45" />

  <!-- Left-Facing Human Head Profile (Clear facial features) -->
  <path d="M 22 28 
           C 20 31, 19 33, 19 35
           C 18 36, 15 37, 15 38.5
           C 15 39.5, 17 40, 18.5 40.5
           C 18.5 41.5, 19.5 42, 18.5 43
           C 18 44, 18.5 45, 19.5 45.5
           C 18 47, 18.5 49, 21.5 50
           C 24 51, 26 51.5, 28 55
           L 30 58" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Back of Neck and Head Silhouette -->
  <path d="M 43 58 
           C 43 53, 44 48, 45 44
           C 46 39, 45 34, 42 30" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.85" stroke-linecap="round" />

  <!-- Top Rim of Head (Open vessel for blossoming thoughts) -->
  <path d="M 22 28 C 26 31, 37 32, 42 30" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Delicate Ear Contour -->
  <path d="M 36 36 C 39 36, 40 38, 39 41 C 38 43, 36 44, 34 43" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.4" stroke-linecap="round" />
  <path d="M 36 38.5 C 37 39, 37 40.5, 36 41" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" stroke-linecap="round" opacity="0.7" />

  <!-- Blooming Flowers and Stems emerging from the mind -->

  <!-- Main Center Stem -->
  <path d="M 32 30 C 31 24, 30 18, 32 12" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Left Branch & Small Flower -->
  <path d="M 31 24 C 27 22, 24 19, 23 16" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.3" stroke-linecap="round" />
  <!-- Left Blossom -->
  <circle cx="23" cy="15" r="2.2" stroke="url(#gold-psico-bloom)" stroke-width="1.3" />
  <path d="M 23 11 C 21 13, 21 17, 23 19 C 25 17, 25 13, 23 11 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" />
  <path d="M 19 15 C 21 13, 25 13, 27 15 C 25 17, 21 17, 19 15 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" />

  <!-- Right Branch & Flower -->
  <path d="M 32 21 C 36 19, 41 18, 44 14" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.3" stroke-linecap="round" />
  <!-- Right Blossom -->
  <circle cx="45" cy="13" r="2.5" stroke="url(#gold-psico-bloom)" stroke-width="1.3" />
  <path d="M 45 8.5 C 43 11, 43 15, 45 17.5 C 47 15, 47 11, 45 8.5 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" />
  <path d="M 40.5 13 C 43 11, 47 11, 49.5 13 C 47 15, 43 15, 40.5 13 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" />

  <!-- Main Top Bloom (Flourishing Central Lotus / Flower) -->
  <circle cx="32" cy="10" r="3" stroke="url(#gold-psico-bloom)" stroke-width="1.4" />
  <path d="M 32 5 C 29 8, 29 12, 32 15 C 35 12, 35 8, 32 5 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.3" stroke-linejoin="round" />
  <path d="M 26.5 10 C 29 7.5, 35 7.5, 37.5 10 C 35 12.5, 29 12.5, 26.5 10 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.3" stroke-linejoin="round" />

  <!-- Elegant Botanical Leaves -->
  <!-- Leaf 1 (Left) -->
  <path d="M 31 22 C 27 23, 27 27, 31 27 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Leaf 2 (Right) -->
  <path d="M 33 26 C 37 25, 38 29, 34 29 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" stroke-linejoin="round" />
  <!-- Leaf 3 (Far Right) -->
  <path d="M 38 19 C 42 21, 40 25, 37 23 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Celestial Mystical Sparkles & Starlight -->
  <path d="M 13 22 L 14.5 24 L 17 25 L 14.5 26 L 13 28 L 11.5 26 L 9 25 L 11.5 24 Z" 
        stroke="url(#gold-psico-bloom)" stroke-width="1.2" stroke-linejoin="round" />
  <circle cx="51" cy="23" r="1.2" fill="#D4AF37" />
  <circle cx="17" cy="12" r="1.2" fill="#D4AF37" />
  <circle cx="50" cy="9" r="1" fill="#D4AF37" />
  <circle cx="28" cy="40" r="1" fill="#D4AF37" opacity="0.6" />
</svg>
