<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-psico-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>

  <!-- Delicate Outer Sacred Circle -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-psico-2)" stroke-width="1.2" stroke-dasharray="2 3" opacity="0.45" />

  <!-- Mystical Brain (Cerebro Místico) - Clear, elegant and unmistakable -->
  
  <!-- Left Hemisphere Outer Contour -->
  <path d="M31 16 C25 15 19 19 17 25 C14 28 14 34 16 38 C14 41 15 47 19 49 C23 51 27 49 31 46" 
        stroke="url(#gold-psico-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        
  <!-- Right Hemisphere Outer Contour -->
  <path d="M33 16 C39 15 45 19 47 25 C50 28 50 34 48 38 C50 41 49 47 45 49 C41 51 37 49 33 46" 
        stroke="url(#gold-psico-2)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Center Division (Corpus Callosum seam) -->
  <path d="M32 17 L32 45" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 3" opacity="0.7" />

  <!-- Left Hemisphere Internal Gyri (Brain folds) -->
  <path d="M22 25 C25 27 28 25 31 27" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M17 33 C22 32 24 37 31 35" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M20 42 C24 40 27 44 31 41" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Right Hemisphere Internal Gyri (Brain folds) -->
  <path d="M42 25 C39 27 36 25 33 27" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M47 33 C42 32 40 37 33 35" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M44 42 C40 40 37 44 33 41" stroke="url(#gold-psico-2)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Crown Lotus & Celestial Sparkle above brain -->
  <path d="M32 7 L33.5 11 L37 12 L33.5 13 L32 16 L30.5 13 L27 12 L30.5 11 Z" 
        stroke="url(#gold-psico-2)" stroke-width="1.3" stroke-linejoin="round" />
        
  <!-- Subtle Crescent Moon cradling the bottom -->
  <path d="M25 53 C29 55 35 55 39 53" stroke="url(#gold-psico-2)" stroke-width="1.75" stroke-linecap="round" />
  
  <!-- Subtle light dots -->
  <circle cx="11" cy="22" r="1" fill="#D4AF37" />
  <circle cx="53" cy="22" r="1" fill="#D4AF37" />
  <circle cx="10" cy="40" r="1" fill="#D4AF37" />
  <circle cx="54" cy="40" r="1" fill="#D4AF37" />
</svg>
