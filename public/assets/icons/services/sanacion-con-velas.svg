  <path d="M32 4 L32 8" stroke="url(#gold-velas)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M22 8 L25 11" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linecap="round" />
  <path d="M42 8 L39 11" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linecap="round" />
  <path d="M17 18 L21 18" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linecap="round" />
  <path d="M47 18 L43 18" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linecap="round" />

  <!-- Sacred Fire / Flame (Double flame for mystical depth) -->
  <path d="M32 10 C27 16 26 21 28 25 C30 27 34 27 36 25 C38 21 37 16 32 10 Z" stroke="url(#gold-velas)" stroke-width="2" stroke-linejoin="round" />
  <path d="M32 16 C30 19 30 22 32 24 C34 22 34 19 32 16 Z" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linejoin="round" />

  <!-- Candle Wick -->
  <path d="M32 26 L32 30" stroke="url(#gold-velas)" stroke-width="1.75" stroke-linecap="round" />

  <!-- Candle Pillar Body -->
  <path d="M24 30 C24 29 40 29 40 30 L40 50 C40 51 24 51 24 50 Z" stroke="url(#gold-velas)" stroke-width="1.75" stroke-linejoin="round" />
  <!-- Melted wax wave line -->
  <path d="M24 30 C27 32 30 30 33 33 C36 31 38 32 40 30" stroke="url(#gold-velas)" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Sacred eye / star engraving on candle body -->
  <path d="M32 38 L33.5 40.5 L36 41.5 L33.5 42.5 L32 45 L30.5 42.5 L28 41.5 L30.5 40.5 Z" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linejoin="round" />

  <!-- Ornate Candlestick Base -->
  <path d="M18 50 C18 55 46 55 46 50 Z" stroke="url(#gold-velas)" stroke-width="1.75" stroke-linejoin="round" />
  <path d="M20 54 L17 56 M44 54 L47 56" stroke="url(#gold-velas)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Floating embers / sparkles -->
  <circle cx="21" cy="25" r="1.2" fill="#D4AF37" />
  <circle cx="43" cy="24" r="1.2" fill="#D4AF37" />
</svg>
