<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="gold-velas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE08B" />
      <stop offset="45%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#B8860B" />
    </linearGradient>
  </defs>
  <!-- Celestial halo ring -->
  <circle cx="32" cy="32" r="30" stroke="url(#gold-velas)" stroke-width="1.25" stroke-dasharray="2 3" opacity="0.6" />

  <!-- Sacred Crescent Moon framing the flame -->
  <path d="M25 15 C28 8 36 8 39 12 C35 11 30 14 30 18 C30 22 34 25 39 25 C35 28 27 25 25 15 Z" stroke="url(#gold-velas)" stroke-width="1.25" stroke-linejoin="round" opacity="0.75" />

